name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @alarab/tools test
      - run: pnpm --filter web lint
      - run: pnpm --filter web build
      - name: Smoke test every page in both languages
        run: |
          pnpm --filter web exec next start -p 3000 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
          node apps/web/scripts/smoke.mjs
