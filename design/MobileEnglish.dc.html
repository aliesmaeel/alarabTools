<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Reem+Kufi:wght@500;600;700&amp;display=swap">
  <style>
    body { margin: 0; background: #F4F5F8; }
    a { color: #3346B8; text-decoration: none; } a:hover { color: #25338A; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div dir="ltr" lang="en" style="width: 390px; height: 844px; overflow: hidden; background: #F4F5F8; color: #161B2F; font-family: 'IBM Plex Sans Arabic', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="height: 60px; flex-shrink: 0; padding-inline: 16px; display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border-bottom: 1px solid #E3E6EF;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 30px; height: 30px; border-radius: 8px; background: #3346B8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Reem Kufi', sans-serif; font-size: 18px; font-weight: 700; line-height: 1;">ع</div>
      <div style="font-family: 'Reem Kufi', sans-serif; font-size: 19px; font-weight: 600;">alarab<span style="color: #3346B8;">Tools</span></div>
    </div>
    <div style="display: flex; align-items: center; gap: 4px;">
      <a href="#" style="height: 44px; padding-inline: 12px; display: flex; align-items: center; color: #161B2F; font-size: 15px; font-weight: 500;">العربية</a>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #161B2F;"><svg viewBox="0 0 24 24" width="24" height="24" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></div>
    </div>
  </header>

  <section style="padding-inline: 16px; padding-block: 24px 20px; background: #FFFFFF; display: flex; flex-direction: column; gap: 14px;">
    <h1 style="margin: 0; font-family: 'Reem Kufi', sans-serif; font-size: 29px; line-height: 1.3; font-weight: 600; text-wrap: balance;">Every PDF and image tool, in Arabic and English.</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.65; color: #5C627A;">47 free tools. Tools marked “Runs on your device” never upload your files.</p>
    <div style="display: flex; align-items: center; gap: 10px; height: 50px; padding-inline: 14px; background: #F4F5F8; border: 1.5px solid #D7DBE7; border-radius: 12px; color: #5C627A;">
      <svg viewBox="0 0 24 24" width="20" height="20" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span style="font-size: 15px;">Search tools</span>
    </div>
  </section>

  <div style="padding-inline: 16px; padding-block: 12px; background: #FFFFFF; border-bottom: 1px solid #E3E6EF; display: flex; gap: 8px; overflow: hidden; font-size: 14px; font-weight: 500;">
    <span style="flex-shrink: 0; height: 36px; padding-inline: 14px; display: flex; align-items: center; border-radius: 999px; background: #161B2F; color: #FFFFFF;">All</span>
    <span style="flex-shrink: 0; height: 36px; padding-inline: 14px; display: flex; align-items: center; border-radius: 999px; background: #F4F5F8; color: #161B2F;">PDF</span>
    <span style="flex-shrink: 0; height: 36px; padding-inline: 14px; display: flex; align-items: center; border-radius: 999px; background: #F4F5F8; color: #161B2F;">Images</span>
        <span style="flex-shrink: 0; height: 36px; padding-inline: 14px; display: flex; align-items: center; border-radius: 999px; background: #F4F5F8; color: #161B2F;">AI</span>
    <span style="flex-shrink: 0; height: 36px; padding-inline: 14px; display: flex; align-items: center; border-radius: 999px; background: #F4F5F8; color: #161B2F;">Arabic</span>
  </div>

  <div style="padding-inline: 16px; padding-block: 16px; display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: #5C627A; padding-block-end: 2px;">MOST USED</span>
    <sc-for list="{{tools}}" as="t" hint-placeholder-count="5">
      <div style="height: 64px; padding-inline: 12px; display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E3E6EF; border-radius: 12px;">
        <sc-if value="{{t.pdf}}" hint-placeholder-val="{{true}}">
          <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: #E9ECFA; color: #3346B8; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" width="20" height="20" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path></svg></div>
        </sc-if>
        <sc-if value="{{t.image}}" hint-placeholder-val="{{false}}">
          <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: #E1F2EE; color: #17735F; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" width="20" height="20" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg></div>
        </sc-if>
        <sc-if value="{{t.arabic}}" hint-placeholder-val="{{false}}">
          <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: #FBEFD6; color: #9A5E05; display: flex; align-items: center; justify-content: center; font-family: 'Reem Kufi', sans-serif; font-size: 22px; font-weight: 700;">هـ</div>
        </sc-if>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
          <span style="font-size: 15px; font-weight: 600;">{{t.name}}</span>
          <span style="font-size: 12.5px; color: #5C627A;">{{t.where}}</span>
        </div>
        <svg viewBox="0 0 24 24" width="18" height="18" style="flex-shrink: 0; fill: none; stroke: #A3A9BD; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M9 6l6 6-6 6"></path></svg>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (name, where, kind) => ({ name, where, pdf: kind === 'pdf', image: kind === 'image', arabic: kind === 'arabic' });
    return {
      tools: [
        row('Merge PDF', 'Runs on your device', 'pdf'),
        row('Compress PDF', 'Deleted from our servers after 1 hour', 'pdf'),
        row('PDF to Word', 'Deleted from our servers after 1 hour', 'pdf'),
        row('Remove background', 'Deleted from our servers after 1 hour', 'image'),
        row('Hijri date stamp', 'Runs on your device', 'arabic')
      ]
    };
  }
}
</script>
</body>
</html>
